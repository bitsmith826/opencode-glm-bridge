# Stack lengkap 9Router + OpenCode Dual Frontier Bridge di VPS
# Jalankan dengan: docker compose -f docker-compose.9router-stack.yml up -d

services:
  9router:
    image: ghcr.io/decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
    depends_on:
      - opencode-bridge

  opencode-bridge:
    build: .
    image: opencode-glm-bridge:latest
    container_name: opencode-bridge
    restart: unless-stopped
    ports:
      - "8318:8318"
    environment:
      - OPENCODE_BRIDGE_PORT=8318
      - OPENCODE_BRIDGE_HOST=0.0.0.0

volumes:
  9router-data:
